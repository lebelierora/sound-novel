<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>るべりえサウンドノベル</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#14100d; height:100%; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100dvh; }
  #stage {
    position:relative; width:min(100vw, 177.78dvh); aspect-ratio:16/9;
    overflow:hidden; background:#000; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .45s; }
  .chara { position:absolute; bottom:19%; height:64%; object-fit:contain; transition:opacity .25s, filter .25s, transform .25s; pointer-events:none; }
  #charaMoco { right:2.5%; }
  #charaMaster { left:2.5%; }
  .dim { opacity:.55; filter:brightness(.72); }
  .hidden { opacity:0; }
  #dialog {
    position:absolute; left:2%; right:2%; bottom:2.2%; min-height:23%;
    background:rgba(20,14,10,.82); border:2px solid rgba(255,235,200,.35); border-radius:14px;
    padding:3.2% 3.5% 2.6%; color:#fff8ec; cursor:pointer;
  }
  #name {
    position:absolute; top:-14px; left:18px; padding:3px 16px; border-radius:999px;
    font-weight:700; font-size:clamp(11px,2.2vw,20px); color:#2a1c10; background:#f2c14e;
  }
  #name.master { background:#ef9a8a; }
  #text { font-size:clamp(13px,2.9vw,27px); line-height:1.55; letter-spacing:.02em; }
  #hint { position:absolute; right:14px; bottom:8px; font-size:clamp(9px,1.6vw,14px); color:#d8c9ae; animation:blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:.9} }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:rgba(12,8,6,.55); color:#fff6e6; text-align:center; padding:4%; z-index:5;
  }
  .overlay > *:first-child { margin-top:auto; }
  .overlay > *:last-child { margin-bottom:auto; }
  .overlay h1 { font-size:clamp(20px,5vw,46px); letter-spacing:.08em; text-shadow:0 2px 14px #000; }
  .overlay h2 { font-size:clamp(14px,3.2vw,28px); margin-top:2.2%; font-weight:600; text-shadow:0 2px 10px #000; }
  .overlay p { margin-top:3%; font-size:clamp(11px,2.2vw,19px); color:#e9dcc2; text-shadow:0 1px 8px #000; }
  .btn {
    margin-top:3.2%; padding:.9em 2.2em; border:none; border-radius:999px; cursor:pointer;
    background:#e4572e; color:#fff; font-size:clamp(13px,2.6vw,23px); font-weight:700;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .btn.sub { background:rgba(20,14,10,.7); border:1px solid rgba(255,240,210,.6); color:#ffeecb; }
  .btn:active { transform:scale(.97); }
  a.btn { text-decoration:none; display:inline-block; }
  #controls {
    position:absolute; top:2%; right:2%; z-index:6; display:flex; gap:8px;
  }
  #controls button {
    border:1px solid rgba(255,240,210,.5); background:rgba(20,14,10,.65); color:#ffeecb;
    border-radius:999px; padding:.35em 1em; font-size:clamp(10px,1.9vw,16px); cursor:pointer;
  }
  #controls button.on { background:#e4572e; border-color:#e4572e; color:#fff; }
  #progress { position:absolute; top:0; left:0; height:4px; background:#e4572e; width:0%; z-index:6; transition:width .3s; }
  #note {
    position:absolute; top:2%; left:2%; z-index:4; max-width:86%;
    background:rgba(16,10,8,.78); color:#fff4dc; border-radius:10px;
    padding:.45em .9em; font-size:clamp(10px,1.9vw,17px); line-height:1.4;
  }
  .gone { display:none !important; }
  .scrollhint { font-size:clamp(10px,1.9vw,15px) !important; color:#d8c9ae !important; margin-top:1.5% !important; }
  #titleCard h1 { font-size:clamp(18px,4.4vw,40px); }
  #titleCard p { margin-top:1.2%; font-size:clamp(10px,2vw,17px); }
  #titleCard .btn { margin-top:2%; padding:9px 20px; font-size:clamp(12px,2.3vw,20px); }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="bg-day.jpg" alt="">
  <img id="charaMaster" class="chara hidden" src="chara-master-smile.png" alt="">
  <img id="charaMoco" class="chara" src="chara-moco-hirameki.png" alt="">

  <div id="controls" class="gone">

    <div id="hint">タップで進む ▼</div>
  </div>
  <div id="titleCard" class="overlay">
    <h1>るべりえサウンドノベル</h1>
    <p>店主とモコが、お店のことを振り返る物語。<br>音が出ます。読みたい章を選んでください。</p>
    <p class="scrollhint">▼ 入りきらない時は、上下にスクロールできます ▼</p>
    <button class="btn" id="startBtn0">▶ プロローグ「赤いコンテナのお店」</button>
    <button class="btn" id="startBtn1">▶ 第一章「店名の由来」</button>
    <button class="btn" id="startBtn2">▶ 第二章「原風景」</button>
    <button class="btn" id="startBtn3">▶ 第三章「初めてのケーキ」</button>
    <button class="btn" id="startBtn4">▶ 第四章「フランス修行」</button>
    <button class="btn" id="startBtn5">▶ 第五章「帰郷」</button>
    <button class="btn" id="startBtn6">▶ 第六章「開業準備」</button>
    <button class="btn" id="startBtn7">▶ 第七章「2016年、開店」</button>
    <a class="btn sub" href="https://lebelierora.github.io/intro/">🏠 お店「るべりえ」の紹介ページ</a>
  </div>
  <div id="endCard" class="overlay gone">
    <h1>つづく</h1>
    <h2 id="endTitle"></h2>
    <p>読んでくれてありがとうございました。</p>
    <p class="scrollhint">▼ 入りきらない時は、上下にスクロールできます ▼</p>
    <button class="btn" id="replayBtn">↺ もう一度</button>
    <button class="btn sub" id="homeBtn">章を選ぶ</button>
    <a class="btn sub" href="https://lebelierora.github.io/intro/">🏠 お店の紹介ページへ</a>
  </div>
  <audio id="voice" preload="auto"></audio>
  <audio id="bgm" src="bgm-bed.mp3" preload="auto" loop></audio>
</div>
<script>
const CHAPTERS = [{"dir": "ch0-", "label": "プロローグ「赤いコンテナのお店」", "masterFrom": 2, "endTitle": "第一章「店名の由来」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "こんにちは！アシスタントのモコです。今日はこのお店、るべりえを案内します！"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "ここは群馬県邑楽町。赤いコンテナが目印の、創作ピザとスイーツのお店です！"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "いらっしゃい！るべりえの中村です。よく来たね、モコ！"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "中村さん！今日はお店のことを、はじめから全部教えてください！"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "全部？はじめから話すと、長ーい話になるよ。"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "大丈夫です！何回にも分けて、ゆっくり聞くので！"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "はは、ありがとう。じゃあまず、このお店の紹介からだね。"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "奥の厨房で毎日ピザを焼いているんだ。名物の揚げピザもあるよ！"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "揚げピザ！…あと、冷凍のピザもあるんですよね？"}, {"sp": "master", "expr": "serious", "bg": "interior", "text": "うん。マイナス三十五度で急速冷凍して、できたての味を閉じ込めてる。ピザ生地には群馬県産小麦100%使っている。それがうちの自慢だよ。"}, {"sp": "master", "expr": "genki", "bg": "interior", "text": "あと、スイーツも忘れずに。もともとパティシエだから、スイーツピザも本気だよ。"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "ピザもスイーツも！欲張りなお店ですね！"}, {"sp": "moco", "expr": "normal", "bg": "evening", "text": "今日の案内はここまで！"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "このお店も今年で十年目。…いろんなことがあったよ。"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "その「いろんなこと」、次から一つずつ、ぜーんぶ聞かせてくださいね！"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "任せて。次は店の名前の由来。るべりえ、ってどういう意味か知ってる？"}, {"sp": "moco", "expr": "surprise", "bg": "evening", "text": "えっ、名前に意味が！？…知らないです！"}, {"sp": "master", "expr": "laugh", "bg": "evening", "text": "あるんだな、これが。続きは第一章で！"}]}, {"dir": "ch1-", "label": "第一章「店名の由来」", "masterFrom": 2, "endTitle": "第二章「原風景」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第一章は店の名前の由来！予告どおり、今日は「るべりえ」の名前のお話だよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "まずは看板を、よーく見てみると…る、り、べ、え。「るりべえ」！"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "惜しい！正しくは「るべりえ」だよ。"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "えー、惜しいですか？「るりべえ」じゃダメなんですか？"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "るりべえだと一気に居酒屋っぽくなるんだよ。"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "たしかに！焼き鳥とお通しが出てきそうです！"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "正しくは「るべりえ」。フランス語の言葉なんだ。"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "フランス語！意味はなんですか？"}, {"sp": "master", "expr": "genki", "bg": "day", "text": "意味は「おひつじ座」。星座の名前だよ。"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "星座！もしかして中村さん、おひつじ座なんですか？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "そう、自分の星座。だから店の名前に選んだんだ。"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "でも、なぜ自分の星座を店の名前に？"}, {"sp": "master", "expr": "serious", "bg": "interior", "text": "おひつじ座は、十二星座の一番最初なんだ。"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "先陣を切って飛び込んでいく。それがおひつじ座ってイメージだね。"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "なるほど！お店を始める自分への、励ましですね！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "その通り。怖さもあったけど、最初の一歩を踏み出す勇気がほしかったんだ。"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "しかも中村さん、気づいてました？群馬の「群」って字、よく見ると「羊」が入ってますよね？", "visual": "vis-kanji.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "お、よく気づいたね。そのとおり、「群」のなかに羊がいるんだよ。"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "それだけじゃないんです。群馬には「羊神社」っていう神社まであるんですよ！", "visual": "vis-shrine.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "羊太夫の伝説が残る土地でね。狛犬じゃなくて、羊の像が迎えてくれるんだ。", "visual": "vis-statue.jpg", "note": "羊太夫（ひつじだゆう）：群馬・多胡に伝わる、羊の伝説の人物"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "じゃあ中村さん、自分の星座だけじゃなくて、地元そのものが羊だったんですね！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "そう。だから余計に、この名前しかないなって思ったんだ。"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "フランス語にしたのは、フランス修行の思い出ですか？"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "それも大きいね。フランスで過ごした時間は、今も自分の土台だから。"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "フランスの話も、いつかたっぷり聞かせてくださいね！"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "任せて。その話は、もう少し先のお楽しみだよ。"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "今日は店の名前の秘密が分かりました！「るべりえ」は、おひつじ座！"}, {"sp": "master", "expr": "laugh", "bg": "evening", "text": "うん。そして「るりべえ」じゃないからね！"}, {"sp": "moco", "expr": "laugh", "bg": "evening", "text": "はい！「るべりえ」です！覚えました！"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "次は原風景。僕が商売に触れた、最初の場所の話だよ。"}, {"sp": "moco", "expr": "surprise", "bg": "evening", "text": "最初の場所？…もしかして、あのお店ですか？"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "ふふ、そのお店だよ。続きは第二章で！"}]}, {"dir": "ch2-", "label": "第二章「原風景」", "masterFrom": 2, "endTitle": "第三章「初めてのケーキ」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第二章は原風景！今日は中村さんの、商売の「最初の場所」のお話だよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "予告で言ってた「あのお店」。ずばり、なんのお店だったんですか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "僕のおじいちゃんとおばあちゃんがやってた、「中村商店」だよ"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "お祖父さんとお祖母さんのお店！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "今でいう、小さなスーパーマーケットみたいな店でね", "visual": "vis-grandmother-counter.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "鮮魚に青果、惣菜に日用品。大体のものは揃ってたんだ", "visual": "vis-shop-aisles.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "小さいのに、なんでもある！", "visual": "vis-shop-fruit.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "そう、店舗併用住宅でね。起きてすぐそこが店、っていう暮らしだったよ"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "店が「行く場所」じゃなくて、「ある場所」だったんですね"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "写真が残ってるんだけど…これが、その店だよ", "visual": "vis-shop1986.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "わあ…！商品が、棚にいっぱい並んでる…！", "visual": "vis-shop1986.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "じいちゃんに抱っこされてるのが、僕。もう40年近く前の写真だよ", "visual": "vis-shop1986.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "おじいちゃんはね、魚を捌くのが上手で、カッコよかったんだ", "visual": "vis-grandfather-fish.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "ほんとだ…！職人さんの手つきだ…！", "visual": "vis-grandfather-fish.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "おばあちゃんの揚げるコロッケは、美味しくて人気だったなあ", "visual": "vis-grandmother-frying.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "コロッケ！それは気になります"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "子どもの僕の仕事はね、店でお客さんに挨拶すること…だった気がする"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "気がする？"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "挨拶すると、お客さんが『偉いね』って褒めてくれたんだ。それが嬉しくてね"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "それは頑張っちゃいますね！立派な営業活動です"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "年末年始は、仕出しの飾りを乗せる手伝いもしたよ"}, {"sp": "moco", "expr": "thinking", "bg": "interior", "text": "仕出しの…飾り？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "お祝いの折詰とかの仕上げだね。忙しい時期の、子どもなりの戦力だったんだと思う"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "市場の仕入れにも、ついて行ったんですよね？"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "うん。ついて行くと、お菓子をケースで買ってもらえるんだ"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "ケース！？箱じゃなくて、ケースですか！？"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "だから、甘いものには目がなくてね"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "甘いもの好きの原点、ここですか…！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "あと、えびす講っていう商売繁盛のお参りがあってね。ついて行くのが楽しかったな"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "商売の神様への、お参りですか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "そう。家族でお参りする光景も、原風景のひとつだよ", "visual": "vis-ebisukou.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "その店は、僕が小学校の3、4年生の頃までだったんだけど…", "visual": "vis-shop-exterior.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "そうだったんですか"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "二人とも、店に立つ姿が、本当に似合ってた"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "今、揚げピザを揚げているとね、ふと浮かぶんだ。お客さんに喜んでもらおうって、コロッケを揚げてたおばあちゃんの姿が", "visual": "vis-grandmother-frying.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "…つながってるんですね。中村商店と、るべりえ"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "えびす講でお参りするたびに思うよ。気持ちは受け継いで、やってるんだなって", "visual": "vis-kumade.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "原風景って、こういうことなんだと思う"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "次は、甘いもの好きの少年の、その後ですね！"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "次は「初めてのケーキ」。図書館で見つけた、一冊の本の話だよ"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "楽しみです！続きは第三章で！"}]}, {"dir": "ch3-", "label": "第三章「初めてのケーキ」", "masterFrom": 2, "endTitle": "第四章「フランス修行」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第三章は「初めてのケーキ」！今日は中村さんが、初めてケーキを作った日のお話だよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "予告で言ってた「図書館で見つけた一冊の本」。あれがケーキ作りの始まりなんですか？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "そうだよ。高校3年生のときの話だ", "visual": "vis-baseball-run.jpg"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "小学生から続けてた野球も、3年の夏で終わってね。卒業のあと、どうしようかって考えてた", "visual": "vis-baseball-bunt.jpg"}, {"sp": "master", "expr": "genki", "bg": "day", "text": "手に職をつけたいな、って思ったんだ", "visual": "vis-baseball.jpg"}, {"sp": "moco", "expr": "thinking", "bg": "day", "text": "手に職…料理の道は、その頃から考えてたんですか？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "もともと甘いものが好きだったからね。食べるだけじゃなくて、自分でも作ってみたいなって"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "それで、図書館へ！"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "そう。レシピ本を探しに行って、一冊の本と出会ったんだ"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "辻製菓専門カレッジが監修した、レシピ本だった"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "辻…！それ、もしかして中村さんが後に通う学校じゃ…？"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "そうなんだよ。その時は、まさか自分が通うことになるとは思ってなかったけどね"}, {"sp": "moco", "expr": "thinking", "bg": "interior", "text": "その本を選んだ決め手は、何だったんですか？"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "なんとなくだよ"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "なんとなく！？"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "その本で、何を作ったんですか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "木苺ソースのミルクレープ"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "ミルクレープ！？最初から、そんな難しいものを！？"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "クレープを何枚も焼いて、クリームとか重ねていくケーキだね。今思えば、無謀だったかな"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "作ったのは、ご自宅で？"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "うん、家の台所。レシピをメモして、材料を買いに行ってね"}, {"sp": "moco", "expr": "thinking", "bg": "interior", "text": "初めてのケーキ作り…うまくいきましたか？"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "8枚くらい重ねたんだけどね。クレープを冷やさないで、クリームを重ねちゃって"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "木苺ソースもゆるくて、切るときにズレてね。見た目は、お世辞にも上手とは言えなかったなあ"}, {"sp": "master", "expr": "genki", "bg": "interior", "text": "でも、味は美味しかったんだ"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "味は！それが一番大事です！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "家族に食べてもらったら、見た目はともかく、みんな喜んで食べてくれてね"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "その後も、ケーキ作りは続けたんですか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "うん。試行錯誤して、美味しく作れるようになったんだ"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "家族には「売り物になるよ」って言われたよ"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "売り物！それはすごい太鼓判ですね！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "高校の先生にも食べてもらう機会があって、喜んでもらえた。その応援も、後押しになったな"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "進路を家族に話したときは、どうでしたか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "反対されるかと思ったけど、応援してもらえたんだ"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "高校を卒業して、進んだのが…あのレシピ本を監修してた、辻製菓専門カレッジだった"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "やっぱり！本で出会った学校に、今度は本当に入学したんですね！"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "しかも、その本の監修に携わった先生が、学校にいてね"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "えっ、本を監修した先生に直接教わったんですか？"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "うん。先生に「君は、毎年何人かいる『シェフ顔』をしているな」って言われたんだ", "visual": "vis-school.jpg"}, {"sp": "moco", "expr": "thinking", "bg": "interior", "text": "シェフ？　がおですか？", "visual": "vis-school.jpg"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "シェフになりそうな顔、ってことらしい。先生の気まぐれかもしれないけど、嬉しくて、自信になったよ", "visual": "vis-school.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "図書館の「なんとなく」が、ここまでつながってたんですね…！"}, {"sp": "master", "expr": "craft", "bg": "interior", "text": "希望すれば、卒業後にフランス校にも行ける。それにも惹かれたんだ"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "フランス校まで通わせてくれた両親には、感謝の気持ちでいっぱいです"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "フランス…！物語は、だんだん大きな世界へ広がっていきますね"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "初めてのケーキは、形は不格好でも、僕の進路を決めてくれた一品だったんだ"}, {"sp": "moco", "expr": "normal", "bg": "evening", "text": "食べる側だった少年が、作る側への一歩を踏み出した日、ですね"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "次は「フランス修行」。学校を卒業して、海を渡るよ"}, {"sp": "moco", "expr": "laugh", "bg": "evening", "text": "楽しみです！続きは第四章で！"}]}, {"dir": "ch4-", "label": "第四章「フランス修行」", "masterFrom": 2, "endTitle": "第五章「帰郷」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第四章は「フランス修行」！今日は中村さんが、フランスで学んだ頃のお話だよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "前回、フランス校に惹かれたって言ってましたけど…本当に行ったんですね！"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。2004年の春。日本を出るのは初めてで、行き先はフランスだった", "visual": "vis-wing.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "初めての海外がフランスって、思い切りましたね！"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "長時間のフライトだったけど、不思議と不安はなかったな。着いた空港は、なんだかおしゃれな感じでね", "visual": "vis-airport.jpg"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "空港からバスで、リヨン郊外の静かな村へ。そこにフランス校「シャトー・エスコフィエ」があった", "visual": "vis-gate.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "学校に着いたのは、何時頃だったんですか？", "visual": "vis-chateau.jpg"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "深夜だよ。とりあえず寮の部屋で荷解きをしてね"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "三人部屋で、ルームメイトは大阪校の二人。まず最初にしたのは、ベッドと机の場所決めじゃんけんだった", "visual": "vis-dorm.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "じゃんけん！結果は？"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "負けて、一番落ち着かない真ん中に決まったよ"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "初日からついてない…！"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "授業はレストラン形式で、厨房・サービス・お客さん役を交代で回すんだ", "visual": "vis-restaurant.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "僕はあんまり怒られなかったんだけど、一度、サービスの時にやらかしてね", "visual": "vis-pastrywork.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "何をしたんですか？"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "お話し中のお客さんのコーヒーカップを下げて、お水を置かなかったんだ。先生に言われたよ"}, {"sp": "master", "expr": "serious", "bg": "interior", "text": "「まだお話を楽しんでいる人のテーブルに、飲み物が何もない状態にするのは、『帰れ』って言っているのと同じだよ」って"}, {"sp": "moco", "expr": "thinking", "bg": "interior", "text": "…深い。接客の心構えですね", "visual": "vis-classroom.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "フランス語の授業もあってね。習った言い回しが本当に伝わるか、街で実践してたんだ", "visual": "vis-frenchclass.jpg"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "友達と理髪店に行った時、僕は「あまり切り過ぎないでください」って細かく伝えて、さっぱりしてもらえた", "visual": "vis-barber.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "おお、伝わったんですね！友達は？"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "友達はちゃんと聞かずに「Oui、Oui」って言ってたら、テクノカットにされて、もみあげがなくなったよ"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "もみあげが…！"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "適当にOuiは言っちゃだめだって、身をもって学んだね"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "研修に出る前の授賞式では、製菓部門の優秀賞をもらった", "visual": "vis-award-front.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "派手なことは何もしてない。昨日の自分に負けないように、毎日積み重ねてきただけだよ", "visual": "vis-award-pair.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "すごい！周りの反応は？", "visual": "vis-award-garden.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "みんな拍手で称えてくれて、嬉しかったよ。優秀賞でもらった白衣は、今も宝物だな", "visual": "vis-youngchef-garden.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "フランスに行かせてくれた両親に、優秀賞という形で、少し恩返しができた気がした", "visual": "vis-chef-pair.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "ご両親も、喜んでくれたでしょうね"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "…でも正直、上には最優秀賞があって、悔しい気持ちもあったんだ"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "嬉しいと悔しいが、半分ずつなんですね"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "研修はロアンヌの街のお菓子屋さん「ピラティー」。リヨンから電車で行くと、駅までシェフが迎えに来てくれてね", "visual": "vis-station.jpg"}, {"sp": "master", "expr": "laugh", "bg": "interior", "text": "とにかく運転が荒くて、それがシェフの第一印象だったな"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "第一印象が運転…！"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "お店の近くの部屋を用意してもらって、そこから通ったよ", "visual": "vis-shopfront.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "当時の僕は、ケーキ屋といえばケーキしか売らないイメージだった。でもあのお店は、バゲットもケーキもお惣菜も、全部そろっててね", "visual": "vis-bread.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "じゃあ、来るお客さんが時間で変わるんですね", "visual": "vis-tartlet.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "朝はパンを買いに来る人、夕方はお惣菜を買いに来る人。お客さんの暮らし方に合わせて使ってもらえる、幅の広いお店だった。るべりえがピザ以外にスイーツピザ・揚げピザ・惣菜も出すのは、ここにつながってる気がする", "visual": "vis-shopinside.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "最初に任されたのは、りんごの皮むき。厨房を仕切る女性に「遅い、代われ」って言われて、手本を見せられたんだ", "visual": "vis-kitchen.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "手本はどうでした？"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "手際が良すぎてね。負けられないって、必死で食らいついたよ", "visual": "vis-him-kitchen.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "負けず嫌いですね！"}, {"sp": "master", "expr": "wry", "bg": "interior", "text": "焼き菓子の焦がしバターで、焦がしが甘くて油っぽくなった時は、怒られたな", "visual": "vis-stove.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "厨房、本当に厳しかったんですね"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "トロワグロっていう有名店で働いてた同僚は、気さくでね。日本が好きな人で、緊張した厨房の空気を和ませてくれた", "visual": "vis-colleague2.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "日本からお土産のお菓子が届いた時は、コアラのマーチを喜んでくれてね", "visual": "vis-colleague-can.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "コアラのマーチ、世界進出ですね"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "ある日、その皮むきの女性に言われたんだ。「君は最初の頃と比べて、上達したよ」って", "visual": "vis-praised.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "最初に「代われ」と言った人に…！", "visual": "vis-group.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "認めてもらえた嬉しさは、今でも忘れない", "visual": "vis-attestation.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "その店では、切り売りのマルゲリータピザも作ってたんだ。ケーキ屋でピザって、当時は驚いたな", "visual": "vis-margherita.jpg", "note": "※マルゲリータの画像はイメージです"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "ケーキ屋さんでピザ！"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "シェフがフランスとイタリアのクォーターでね。イタリアの食文化も、そこで体感できたんだ"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "そのマルゲリータ、いつも賄いで持ち帰らせてもらってね。毎回食べても、飽きがこなかったんだ"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "派手じゃなくても、そういうものを自分も作りたいと思った", "visual": "vis-agepizza.jpg"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "りんごの皮むきの日々は、今のりんごのスイーツピザに生きてる。仕込みでりんごを剥くたび、あの厨房を思い出すよ", "visual": "vis-apples-then-now.jpg"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "研修を終えて学校に戻ると、仲間と研修先の話で盛り上がって、お疲れ会を楽しんだ", "visual": "vis-party.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "evening", "text": "研修先の話、尽きなかったでしょうね"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "嬉しいような、悲しいような。名残惜しい気持ちで、約1年のフランス生活が終わった", "visual": "vis-spread.jpg"}, {"sp": "moco", "expr": "normal", "bg": "evening", "text": "次は「帰郷」。日本に戻ってからのお話ですね"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "うん。続きは第五章で！"}]}, {"dir": "ch5-", "label": "第五章「帰郷」", "masterFrom": 2, "endTitle": "第六章「開業準備」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第五章は「帰郷」！フランスから帰ってきた中村さんのお話だよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "フランス修行を終えて、日本に帰ってきたんですよね"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。2005年に帰国してね。まず食べたのは、やっぱり寿司だったな"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "寿司ですか！"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "フランスでは食べられない日本食が、無性に恋しくてね"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "家族とも再会したんですよね"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "お土産のワインとチーズを囲んで、フランスの思い出話に花が咲いたよ"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "いい帰国ですね！"}, {"sp": "master", "expr": "thinking", "bg": "day", "text": "それから東京で、ケーキ屋さんに5年、揚げピザのお店に4年勤めた"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "フランスで学んだことを、現場で磨いたんですね"}, {"sp": "master", "expr": "thinking", "bg": "day", "text": "働きながら、ずっと気になっていたことがあってね。ケーキやパンは、ショーケースに並べる以上、どうしても売れ残りが出てしまうこと"}, {"sp": "moco", "expr": "serious", "bg": "day", "text": "作ったものが残ってしまうのは、作り手として辛いですね"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "揚げピザも、食べてもらえば美味しいんだけど、油が体に合わないお客様には、どうしても届かなかった"}, {"sp": "moco", "expr": "thinking", "bg": "day", "text": "美味しくても、届かない壁があったんですね"}, {"sp": "master", "expr": "craft", "bg": "day", "text": "だから自分の店では、注文を受けてから作って、ロスを出さず、お客様を待たせすぎない。そういう商品を、ずっと考えていたよ"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "今のるべりえのスタイルは、そこで生まれたんですね！"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "東京での生活にも一区切りがついてね。そろそろ自分の店を、と思い立って、地元に戻ることを決めたんだ"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "ついに帰郷ですね！"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "久しぶりの邑楽は、昔ながらのお店が残っていて、懐かしかったな"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "変わったところはありました？"}, {"sp": "master", "expr": "thinking", "bg": "day", "text": "ピザ屋さんが、なかったんだよね"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "えっ、地元にピザ屋さんがなかったんですか？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。でもその時はまだ、開業の資金がなくてね"}, {"sp": "moco", "expr": "serious", "bg": "day", "text": "飲食のお仕事では、なかなか貯まらなかった？"}, {"sp": "master", "expr": "troubled", "bg": "day", "text": "技術は学べても、資金は正直たまらなかった。一度、飲食の道から離れて、資金を貯めるために働こうと決めたよ"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "地元の企業に勤めたんですね"}, {"sp": "master", "expr": "serious", "bg": "interior", "text": "正社員になって、大変なこともあったけど……自分の店を開くためだと思うと、どんなことも苦ではなかった"}, {"sp": "moco", "expr": "laugh", "bg": "interior", "text": "その一心で貯め続けたんですね"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "そして、資金が目標の額に届いた頃、思わぬ知らせが来た"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "思わぬ知らせ？"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "祖父母が営んでいた中村商店が、駐車場として借りていた土地と、奥の畑が、売りに出されたんだ", "visual": "vis-land.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "evening", "text": "借りていたその駐車場の土地が！", "visual": "vis-land.jpg"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "場所を押さえて、不安だった融資も無事に決まってね。開業への道が、一気に開けた気がしたよ"}, {"sp": "moco", "expr": "laugh", "bg": "evening", "text": "原風景の場所に、戻ってきたんですね"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "ああ。ここからが、開業準備の始まりだね"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "次回、第六章「開業準備」。いよいよお店づくりが始まるよ！"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "うん。続きは第六章で！"}]}, {"dir": "ch6-", "label": "第六章「開業準備」", "masterFrom": 2, "endTitle": "第七章「2016年、開店」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第六章は「開業準備」！土地と融資が決まって、いよいよお店づくりが始まるよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "まずは、お店の形を決めるところからですよね"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。お店を開くにあたって、できるだけ地元や群馬のものを取り入れたくてね"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "群馬のものを？"}, {"sp": "master", "expr": "thinking", "bg": "day", "text": "店のイメージを考えてたときに、普通の建物よりも目立つものにしたくて。コンテナハウス型の店舗に行きついたんだ"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "コンテナ！？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "調べてたら、同じ群馬県にコンテナハウスを扱う事業者さんがあってね。群馬の会社にお願いできたんだ", "visual": "vis-container.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "目立つし、地元だし、一石二鳥ですね！"}, {"sp": "master", "expr": "thinking", "bg": "day", "text": "色は最初、黒いコンテナをイメージしてたんだけど……", "visual": "vis-black.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "黒ですか"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "ちょっと威圧感があるかなと思って、オレンジに変えたんだ", "visual": "vis-orange.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "オレンジ……あれ、今のお店、赤ですよね？"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "カラーイメージの印刷が、たまたま赤が強く出ちゃってね。イメージと違ったんだけど、よく見たら赤の方が目立つから「いいじゃん」ってなったんだ"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "印刷の偶然で決まったんですか！？今や「赤いコンテナが目印」なのに！"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "結果的に、あの赤がお店の顔になったね", "visual": "vis-red.jpg"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "届いたコンテナは真っ白だったんだけど、塗装の下塗りをしたらピンク色になってね", "visual": "vis-pink1.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "ピンクですか！？"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "近所の人たちも心配していたみたいだよ。最後に赤く塗り上がったら、みんなほっと一息ついていた", "visual": "vis-pink2.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "そういえば、お店の前のヤシの木。あれも開業準備で植えたんですか？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。コンテナハウスとヤシの木は相性がいいって聞いて、入れたかったんだ。でも予算を大幅に超えてて、諦めようかと思ってたよ"}, {"sp": "moco", "expr": "troubled", "bg": "day", "text": "あらら……"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "そしたら、お店から遠くない造園所で破格で売っててね。近いから、植え込みまでしてくれたんだ", "visual": "vis-palm.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "day", "text": "地元のつながり、ここでも！", "visual": "vis-palm-done.jpg"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "設備の方はどうでしたか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "東京時代にお世話になった方に紹介してもらって、ツジキカイさんから電気式の石窯「イーナポリ500」を導入したよ", "visual": "vis-oven.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "石窯！本格的ですね"}, {"sp": "master", "expr": "thinking", "bg": "interior", "text": "実は当時、揚げピザじゃなくて、カルツォーネのお店にしようと考えてたんだ", "visual": "vis-calzone-make.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "カルツォーネ！？今と全然違いますね", "visual": "vis-calzone-cut.jpg"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "窯のラボで試し焼きをさせてもらってね。カルツォーネは、想像以上に焼き上がりに時間がかかった", "visual": "vis-testlab.jpg"}, {"sp": "moco", "expr": "troubled", "bg": "interior", "text": "それは誤算でしたね……", "visual": "vis-calzone-oven.jpg"}, {"sp": "master", "expr": "thinking", "bg": "interior", "text": "ホールピザは焼いたことがなかったんだけど、「どうせなら」と試しに焼いてみたら、想像以上に美味しく焼けてね", "visual": "vis-pizza.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "interior", "text": "ついでの一枚が！？"}, {"sp": "master", "expr": "warm", "bg": "interior", "text": "今思えばまだまだだったけどね。でも、ピザといえば丸いピザを連想するから、ホールピザをメインにしようと決めたんだ"}, {"sp": "moco", "expr": "normal", "bg": "interior", "text": "揚げピザはどうしたんですか？"}, {"sp": "master", "expr": "smile", "bg": "interior", "text": "経験のある揚げピザも名物として出して、パティシエの技術を活かしたスイーツピザも並べる。今の形は、ここで決まったんだ", "visual": "vis-fried.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "interior", "text": "カルツォーネのお店になってたら、今頃どうなってたんでしょうね", "visual": "vis-calzone-baked.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "工事の方は、どう始まったんですか？"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "まず地鎮祭 , "bg": "evening", "text": "チラシをまいて、SNSでも告知して。あとは、お客様が来てくれるかどうか……"}, {"sp": "master", "expr": "serious", "bg": "evening", "text": "果たして、お客様は来てくれるのか。それが一番の心配だった"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "次回、第七章「2016年、開店」。ついにお店がオープンするよ！"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "うん。続きは第七章で！"}]}, {"dir": "ch7-", "label": "第七章「2016年、開店」", "masterFrom": 2, "endTitle": "第八章「10年目」", "lines": [{"sp": "moco", "expr": "hirameki", "bg": "day", "text": "第七章は「2016年、開店」！いよいよオープンだよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "前回、心配していたじゃないですか。お客様は来てくれるのかって"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "うん。結論から言うと、プレオープンの日から、たくさんのお客様が来てくれたんだ"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "初日からですか！？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "プレオープンは2016年4月15日から17日の3日間だった", "visual": "vis-lineup.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "3日間もプレオープンしたんですね"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "初日は朝7時から開店準備をしてね。接客は両親と姉が手伝ってくれて、実家では親戚が買い出しをサポートしてくれたんだ", "visual": "vis-kitchen-hands.jpg"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "おじいちゃんとおばあちゃんも、ピザ箱を組み立ててくれていたんだ"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "家族総動員じゃないですか"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "オープン時間が近づいて、販売間口から外を見たら、だんだんとお客様が集まってきていてね", "visual": "vis-crowd.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "行列ができてたんですか？"}, {"sp": "master", "expr": "laugh", "bg": "day", "text": "みんなで「来てくれてる……！」ってね。近所の人がちょっと来るだけだと思っていたから、本当に嬉しい誤算だった"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "チラシだけじゃなくて、SNSを見て来てくれた人もいてね。お店のことに興味を持ってくれている人がこんなにいてくれたんだって、本当に嬉しかったよ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "オープン前から、気にかけてくれてた人たちがいたんですね"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "初めてのお客様は、どんな方でした？"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "近所のおばあさんでね。ホールピザと揚げピザを、10個ずつ買ってくれたんだ"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "10個ずつ！？"}, {"sp": "master", "expr": "craft", "bg": "day", "text": "プレオープンはメニューを絞って、ホールピザのマルゲリータと、揚げピザの群馬ルゲリータの2品だけ。どちらも300円だった", "visual": "vis-ch7-margherita.jpg", "note": "※価格は2016年当時のものです"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "注文を受けてから作る形でしたよね", "visual": "vis-fried-open.jpg"}, {"sp": "master", "expr": "craft", "bg": "day", "text": "そう。1日500個分を用意したんだけど、ピザ生地が完売してね。それが3日間続いたんだ", "visual": "vis-dough.jpg"}, {"sp": "moco", "expr": "surprise", "bg": "day", "text": "3日間完売！？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "役割分担は、姉が外でお客様の誘導、母が会計と接客、父が揚げ場。僕はひたすらピザを作っていたよ", "visual": "vis-ch7-kitchen.jpg"}, {"sp": "moco", "expr": "troubled", "bg": "day", "text": "フル回転ですね……"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "最初はイートインとテイクアウトの両方をやるつもりだったんだけど、注文がパンクしてね。最初の1回転で店内を閉めて、テイクアウトのみに切り替えたんだ", "visual": "vis-interior.jpg"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "嬉しい悲鳴ですね"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "不安は、そこで解けましたか？"}, {"sp": "master", "expr": "serious", "bg": "day", "text": "正直、そんなことを考えている余裕はなかったよ。注文が入ったピザを、がむしゃらに作っていた。それだけだった"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "……それが答えですね"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "怒涛のプレオープンを終えて、当初は本オープンから一人で営業する予定だったんだけど、家族会議で「1人じゃ無理だよな」ってなってね"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "プレオープンを見たら、そうなりますよね"}, {"sp": "master", "expr": "warm", "bg": "day", "text": "1年間だけ、姉が接客を手伝ってくれることになって、両親もそれぞれの仕事の合間に手伝ってくれたんだ"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "家族に支えられた船出ですね"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "そして4月18日、本オープン。最初はメニューを絞って営業していてね。だんだん毎月メニューを増やしていったんだ", "visual": "vis-counter.jpg"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "今のメニューの多さは、その積み重ねなんですね"}, {"sp": "master", "expr": "wry", "bg": "day", "text": "プレオープンが終われば、落ち着いた営業が続くと思っていたんだけどね。しばらくは忙しい日々が続いたんだ"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "嬉しい誤算が、まだ続いてたんですね"}, {"sp": "moco", "expr": "normal", "bg": "day", "text": "お客様の反応はどうでした？"}, {"sp": "master", "expr": "smile", "bg": "day", "text": "心配していた揚げピザの反応も良くてね。「揚げピザおいしいね」って、リピートしてくれるお客様も増えてきたよ"}, {"sp": "moco", "expr": "laugh", "bg": "day", "text": "よかった……！"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "プレオープンの日は、とても風が強い日でね。そんな中を長時間並んで待ってくれたお客様には、ありがたい気持ちと、申し訳ない気持ちでいっぱいだったよ"}, {"sp": "moco", "expr": "normal", "bg": "evening", "text": "風の中を、長時間待っててくれたんですね"}, {"sp": "master", "expr": "warm", "bg": "evening", "text": "お店作りから開店まで関わってくれた方々、手伝ってくれた家族や親戚、お祝いを送ってくれた同級生、応援してくれた近所の方たちには、感謝してもしきれないよ", "visual": "vis-ch7-group.jpg"}, {"sp": "moco", "expr": "normal", "bg": "evening", "text": "たくさんの人に支えられた開店だったんですね"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "うん。こうして、るべりえの営業が始まったんだ", "visual": "vis-flowers.jpg"}, {"sp": "moco", "expr": "hirameki", "bg": "evening", "text": "次回、第八章「10年目」。いよいよ最終章だよ！"}, {"sp": "master", "expr": "smile", "bg": "evening", "text": "うん。続きは第八章で！"}]}];
const BG = { day:"bg-day.jpg", interior:"bg-interior.jpg", evening:"bg-evening.jpg" };
const NAME = { moco:"モコ", master:"中村" };
const stage = document.getElementById('stage');
const bgEl = document.getElementById('bg');
const mocoEl = document.getElementById('charaMoco');
const masterEl = document.getElementById('charaMaster');
const dialog = document.getElementById('dialog');
const nameEl = document.getElementById('name');
const textEl = document.getElementById('text');
const voice = document.getElementById('voice');
const bgm = document.getElementById('bgm');
const autoBtn = document.getElementById('autoBtn');
const bgmBtn = document.getElementById('bgmBtn');
const BGM_BASE = 1.0, BGM_DUCK = 1.0;
let CH = CHAPTERS[0], LINES = CH.lines;
let idx = -1, auto = true, started = false, bgmOn = true, bgmTimer = null;

function fadeBgm(target){
  if (bgmTimer) clearInterval(bgmTimer);
  const from = bgm.volume;
  let step = 0;
  bgmTimer = setInterval(()=>{
    step++;
    bgm.volume = Math.max(0, Math.min(1, from + (target - from) * step / 12));
    if (step >= 12){ clearInterval(bgmTimer); bgmTimer = null; }
  }, 30);
}
function playBgm(duck){
  if (!bgmOn) return;
  if (bgm.paused) bgm.play().catch(()=>{});
  fadeBgm(duck ? BGM_DUCK : BGM_BASE);
}
function masterPresent(i){ return i >= CH.masterFrom; }
function show(i){
  const L = LINES[i];
  const noteEl = document.getElementById('note');
  if (L.visual){
    bgEl.src = L.visual;
    bgEl.style.objectFit = L.fit ? 'contain' : 'cover';
    mocoEl.classList.add('hidden'); masterEl.classList.add('hidden');
  } else {
    bgEl.src = BG[L.bg];
    bgEl.style.objectFit = 'cover';
    if (L.sp==="moco"){ mocoEl.src = "chara-moco-"+L.expr+".png"; }
    if (L.sp==="master"){ masterEl.src = "chara-master-"+L.expr+".png"; }
    mocoEl.classList.toggle('hidden', false);
    masterEl.classList.toggle('hidden', !masterPresent(i));
  }
  if (L.note){ noteEl.textContent = L.note; noteEl.classList.remove('gone'); }
  else noteEl.classList.add('gone');
  mocoEl.classList.toggle('dim', L.sp!=="moco");
  masterEl.classList.toggle('dim', L.sp!=="master");
  nameEl.textContent = NAME[L.sp];
  nameEl.classList.toggle('master', L.sp==="master");
  textEl.textContent = L.text;
  textEl.style.fontSize = '';
  const cs = parseFloat(getComputedStyle(textEl).fontSize);
  const nLines = Math.round(textEl.offsetHeight / (cs * 1.55));
  if (nLines >= 3) textEl.style.fontSize = Math.floor(cs * 2.0 / nLines) + 'px';
  document.getElementById('progress').style.width = ((i+1)/LINES.length*100)+"%";
  voice.src = CH.dir + "line" + String(i).padStart(2,'0') + ".mp3";
  voice.currentTime = 0;
  voice.play().catch(()=>{});
  playBgm(true);
}
function next(){
  if (!started) return;
  if (idx >= LINES.length-1){
    voice.pause();
    playBgm(false);
    dialog.classList.add('gone');
    document.getElementById('controls').classList.add('gone');
    mocoEl.classList.add('hidden'); masterEl.classList.add('hidden');
    bgEl.src = BG.evening;
    document.getElementById('endTitle').textContent = CH.endTitle;
    document.getElementById('endCard').classList.remove('gone');
    document.getElementById('progress').style.width = "100%";
    return;
  }
  idx++; show(idx);
}
voice.addEventListener('ended', ()=>{ if (auto) next(); else playBgm(false); });
function startChapter(n){
  CH = CHAPTERS[n]; LINES = CH.lines;
  document.getElementById('titleCard').classList.add('gone');
  document.getElementById('endCard').classList.add('gone');
  dialog.classList.remove('gone');
  document.getElementById('controls').classList.remove('gone');
  bgm.currentTime = 0; bgm.volume = 0; playBgm(true);
  started = true; idx = -1; next();
}
document.getElementById('startBtn0').addEventListener('click', ()=>startChapter(0));
document.getElementById('startBtn1').addEventListener('click', ()=>startChapter(1));
document.getElementById('startBtn2').addEventListener('click', ()=>startChapter(2));
document.getElementById('startBtn3').addEventListener('click', ()=>startChapter(3));
document.getElementById('startBtn4').addEventListener('click', ()=>startChapter(4)); document.getElementById('startBtn5').addEventListener('click', ()=>startChapter(5));
document.getElementById('startBtn6').addEventListener('click', ()=>startChapter(6));
document.getElementById('startBtn7').addEventListener('click', ()=>startChapter(7));
document.getElementById('replayBtn').addEventListener('click', ()=>{
  document.getElementById('endCard').classList.add('gone');
  dialog.classList.remove('gone');
  document.getElementById('controls').classList.remove('gone');
  bgm.currentTime = 0; bgm.volume = 0; playBgm(true);
  started = true; idx = -1; next();
});
document.getElementById('homeBtn').addEventListener('click', ()=>{
  voice.pause(); started = false;
  document.getElementById('endCard').classList.add('gone');
  document.getElementById('titleCard').classList.remove('gone');
  document.getElementById('progress').style.width = "0%";
});
dialog.addEventListener('click', ()=>{ next(); });
autoBtn.addEventListener('click', (e)=>{ e.stopPropagation(); auto=!auto; autoBtn.classList.toggle('on', auto); if (auto && voice.ended) next(); });
bgmBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  bgmOn = !bgmOn;
  bgmBtn.classList.toggle('on', bgmOn);
  if (bgmOn) playBgm(!(voice.paused || voice.ended));
  else { fadeBgm(0); setTimeout(()=>{ if (!bgmOn) bgm.pause(); }, 400); }
});
document.getElementById('backBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if (idx>0){ idx--; show(idx); } });
stage.addEventListener('pointerdown', ()=>{
  if (voice.paused && started && idx >= 0 && idx < LINES.length) voice.play().catch(()=>{});
  if (started && bgmOn && bgm.paused) playBgm(!(voice.paused || voice.ended));
});
</script>
</body>
</html>
